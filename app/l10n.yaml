# Traduzioni dell'interfaccia (tappa «Lingua», L1). L'italiano è il modello: ogni testo nuovo si scrive prima in
# app_it.arb (con la descrizione «@...»), poi in app_en.arb, poi `flutter gen-l10n` (lo fa da solo anche
# `flutter pub get`, non `flutter test`). Il codice generato (lib/l10n/app_localizations*.dart) è versionato, così ogni
# clone compila subito; test/l10n_test.dart controlla che i due file abbiano gli stessi testi e che il codice sia aggiornato.
arb-dir: lib/l10n
template-arb-file: app_it.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# AppLocalizations.of(context) senza «!»: c'è sempre, il MaterialApp registra il delegato.
nullable-getter: false
# Testi inglesi mancanti elencati qui (file non versionato) invece di lasciar passare l'italiano in silenzio.
untranslated-messages-file: build/l10n-non-tradotti.json
